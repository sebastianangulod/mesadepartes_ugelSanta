version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mesa_app
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mesa_de_partes
      DB_USERNAME: mesa_user
      DB_PASSWORD: mesa_pass
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      - db

  web:
    image: nginx:1.27-alpine
    container_name: mesa_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Planificador de tareas (cron de Laravel): ejecuta schedule:run
  # cada minuto para los vencimientos automáticos. No expone puertos.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mesa_scheduler
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mesa_de_partes
      DB_USERNAME: mesa_user
      DB_PASSWORD: mesa_pass
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mesa_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mesa_de_partes
      MYSQL_USER: mesa_user
      MYSQL_PASSWORD: mesa_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

